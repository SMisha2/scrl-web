name: ScRl checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrl-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Syntax and regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Supabase Edge Function types
        run: |
          deno check supabase/functions/scrl-account/index.ts
          deno check supabase/functions/scrl-ai/index.ts
          deno check supabase/functions/scrl-moderation/index.ts

      - name: Check JavaScript syntax
        run: |
          node --check js/config.js
          node --check js/core.js
          node --check js/backend.js
          node --check js/app.js
          node --check sw.js

      - name: Run regression tests
        run: node --test tests/*.test.cjs
