<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#6e9fc1"/><stop offset=".48" stop-color="#b7d4c2"/><stop offset="1" stop-color="#e3d9aa"/></linearGradient>
  <radialGradient id="sun"><stop stop-color="#fff7c8" stop-opacity="1"/><stop offset=".18" stop-color="#fff0b0" stop-opacity=".8"/><stop offset="1" stop-color="#fff1bd" stop-opacity="0"/></radialGradient>
  <linearGradient id="far" x2="0" y2="1"><stop stop-color="#728f86"/><stop offset="1" stop-color="#496d5a"/></linearGradient>
  <linearGradient id="mid" x2="0" y2="1"><stop stop-color="#416d4e"/><stop offset="1" stop-color="#244b39"/></linearGradient>
  <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#4d7540"/><stop offset=".45" stop-color="#315a37"/><stop offset="1" stop-color="#172e27"/></linearGradient>
  <linearGradient id="water" x2="0" y2="1"><stop stop-color="#98c6b5" stop-opacity=".65"/><stop offset="1" stop-color="#3c7781" stop-opacity=".16"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="32"/></filter>
  <filter id="mist"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shadow"><feGaussianBlur stdDeviation="13"/></filter>
  <linearGradient id="ray"><stop stop-color="#fff2bc" stop-opacity="0"/><stop offset=".48" stop-color="#fff4cf" stop-opacity=".22"/><stop offset="1" stop-color="#fff2bc" stop-opacity="0"/></linearGradient>
</defs>
